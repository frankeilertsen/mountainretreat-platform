# Render Blueprint – Mountain Retreat (FKE Property AS)
# Render → New → Blueprint → choose this repository. Creates the web service and the database in Frankfurt.
# Values marked "sync: false" are asked for when the Blueprint is created.
services:
  - type: web
    name: mountainretreat
    runtime: node
    region: frankfurt
    plan: starter                     # always on, 512 MB RAM
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate # database changes + first administrator, before each new version goes live
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:                             # photos and PDF presentations (kept across deploys; Render takes snapshots)
      name: files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mountainretreat-db
          property: connectionString
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: RUN_JOBS_IN_PROCESS        # background jobs every minute inside the web service
        value: "1"
      - key: ENCRYPTION_KEY             # generated by Render – never change after people have logged in
        generateValue: true
      - key: TOKEN_PEPPER
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL        # the first administrator (you)
        sync: false
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Mountain Retreat <booking@mountainretreat.no>
      - key: EMAIL_REPLY_TO
        sync: false
      - key: ALLOW_MOCK_PAYMENTS        # "1" while testing (clearly marked test payment). Set to 0 before real guests.
        sync: false
# APP_URL is added in the dashboard when your own domain is connected (until then the onrender.com address is used).

databases:
  - name: mountainretreat-db
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 1   # plenty for this platform; can be increased later, never decreased
    postgresMajorVersion: "16"
    databaseName: mountainretreat
    user: mountainretreat
    ipAllowList: []                   # no access from the internet – only from Render services in the same region
